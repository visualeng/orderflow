# Тесты: linux — с настоящим postgres (service container),
# windows — юнит-тесты без базы: интеграционные там аккуратно
# пропускаются через TEST_DATABASE_URL.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-linux:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: orderflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # логин и пароль — отдельными переменными: pgjdbc не разбирает их
      # внутри JDBC URL и принимает за часть хоста
      TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/orderflow_test
      TEST_DATABASE_USER: postgres
      TEST_DATABASE_PASSWORD: ci_password

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: тесты
        run: ./mvnw -B test

  # сборка образа и живой прогон: compose поднимает postgres + приложение,
  # ждём healthz и выключаем
  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: docker compose up
        run: docker compose up --build --detach --wait --wait-timeout 180

      - name: healthz
        run: |
          sleep 3
          curl --fail --silent http://localhost:8080/actuator/health

      - name: docker compose down
        if: always()
        run: docker compose down --volumes

  test-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: тесты без базы
        run: .\mvnw.cmd -B test
