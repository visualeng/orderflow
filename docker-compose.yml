# > docker compose up --build
#
# Поднимает postgres и приложение одной командой: база создастся,
# миграции применятся, сервер будет на localhost:8080.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: orderflow
      POSTGRES_DB: orderflow
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orderflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/orderflow
      DATABASE_USER: postgres
      DATABASE_PASSWORD: orderflow
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  db-data:
